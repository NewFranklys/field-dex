name: Update i18n lockfile
on:
  push:
    branches: [feat/i18n-foundation]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockbot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update i18n lockfile [lockbot]"
          git push origin HEAD:feat/i18n-foundation
